  <div id="app"></div>

<script>
/* =========================================================
   CLI SQL — Aprende SQL desde cero jugando.
   Arquitectura: datos (teoría + retos) -> estado -> render.
   Incluye un mini motor de base de datos relacional en memoria.
   ========================================================= */

/* ---------- 1. TEORÍA: cada tema con la estructura obligatoria ---------- */
const THEORY = {
  select: {
    name: "SELECT", tagline: "Consulta filas de una tabla",
    what: "SELECT es la instrucción para leer datos. 'SELECT * FROM tabla' devuelve todas las columnas y todas las filas de esa tabla.",
    how: "El motor localiza la tabla, la recorre fila a fila y construye un resultado con las columnas pedidas. Cada fila del resultado tiene la misma estructura: mismas columnas y en el mismo orden.",
    real: "Es la operación más común de SQL: consultar un catálogo, listar usuarios o revisar los pedidos del día.",
    syntax: "SELECT * FROM tabla;",
    examples: [{ cmd: "SELECT * FROM clientes", out: "id | nombre | ciudad | edad\n---+--------+--------+-----\n 1 | Ana    | Madrid | 28\n 2 | Luis   | Bogota | 34" }]
  },
  columnas: {
    name: "columnas", tagline: "Elige solo lo que necesitas",
    what: "Puedes pedir columnas concretas separándolas por comas: SELECT nombre, ciudad FROM clientes.",
    how: "El motor hace una proyección: de cada fila toma únicamente las columnas indicadas y descarta el resto, así viajan menos datos.",
    real: "Cuando una tabla tiene 40 columnas pero solo te interesan 2 para un informe.",
    syntax: "SELECT col1, col2 FROM tabla;",
    examples: [{ cmd: "SELECT nombre, ciudad FROM clientes", out: "nombre | ciudad\n-------+-------\nAna    | Madrid\nLuis   | Bogota" }]
  },
  where: {
    name: "WHERE", tagline: "Filtra las filas",
    what: "WHERE descarta las filas que no cumplen una condición. Solo pasan las que se evalúan como verdaderas.",
    how: "El motor evalúa la condición en cada fila: si es verdadera la conserva y si no la descarta. Los comparadores son = , <> , < , > , <= y >=.",
    real: "Ver solo los pedidos de un cliente concreto o los productos con stock bajo.",
    syntax: "SELECT * FROM tabla WHERE condicion;",
    examples: [{ cmd: "SELECT * FROM clientes WHERE ciudad = 'Madrid'", out: "id | nombre | ciudad | edad\n---+--------+--------+-----\n 1 | Ana    | Madrid | 28\n 3 | Marta  | Madrid | 22" }]
  },
  operadores: {
    name: "AND / OR / NOT", tagline: "Combina condiciones",
    what: "Con AND, OR y NOT unes varias condiciones. AND exige que se cumplan todas; OR, que se cumpla al menos una; NOT invierte el resultado.",
    how: "El motor evalúa según la precedencia: primero los paréntesis, luego AND y por último OR.",
    real: "Clientes de Madrid mayores de 20 años: ciudad = 'Madrid' AND edad > 20.",
    syntax: "WHERE cond1 AND cond2   |   WHERE cond1 OR cond2",
    examples: [{ cmd: "SELECT * FROM clientes WHERE ciudad='Madrid' AND edad>20", out: "id | nombre | ciudad | edad\n---+--------+--------+-----\n 1 | Ana    | Madrid | 28\n 3 | Marta  | Madrid | 22" }]
  },
  orderby: {
    name: "ORDER BY", tagline: "Ordena los resultados",
    what: "ORDER BY ordena las filas por una o más columnas, de forma ascendente (ASC) o descendente (DESC).",
    how: "Tras filtrar, el motor ordena la lista comparando los valores de la columna clave. Por defecto usa ASC (de menor a mayor).",
    real: "Ver los productos del más caro al más barato o los clientes por edad.",
    syntax: "SELECT * FROM tabla ORDER BY columna [DESC];",
    examples: [{ cmd: "SELECT nombre, precio FROM productos ORDER BY precio DESC", out: "nombre  | precio\n--------+-------\nMonitor | 199\nWebcam  | 59\nTeclado | 45.5\nRaton   | 19.9" }]
  },
  limit: {
    name: "LIMIT", tagline: "Quédate con los primeros",
    what: "LIMIT recorta el resultado para devolver solo las N primeras filas.",
    how: "El motor genera el resultado completo y luego se queda con las primeras N filas. Combinado con ORDER BY obtienes el 'Top N'.",
    real: "El podio: los 3 productos más vendidos del mes.",
    syntax: "SELECT * FROM tabla ORDER BY col DESC LIMIT n;",
    examples: [{ cmd: "SELECT nombre, precio FROM productos ORDER BY precio DESC LIMIT 2", out: "nombre  | precio\n--------+-------\nMonitor | 199\nWebcam  | 59" }]
  },
  distinct: {
    name: "DISTINCT", tagline: "Valores únicos",
    what: "DISTINCT elimina las filas repetidas del resultado.",
    how: "El motor recuerda lo que ya ha visto y descarta los duplicados comparando la fila completa.",
    real: "Saber en qué ciudades tenemos clientes, sin repetir ninguna.",
    syntax: "SELECT DISTINCT columna FROM tabla;",
    examples: [{ cmd: "SELECT DISTINCT ciudad FROM clientes", out: "ciudad\n-------\nMadrid\nBogota\nLima" }]
  },
  insert: {
    name: "INSERT", tagline: "Añade filas",
    what: "INSERT INTO inserta una fila nueva en una tabla.",
    how: "El motor crea un objeto fila con los valores indicados, comprueba que encajen con las columnas y lo añade al final de la tabla.",
    real: "Dar de alta un cliente nuevo o registrar un pedido.",
    syntax: "INSERT INTO tabla VALUES (v1, v2, ...);",
    examples: [{ cmd: "INSERT INTO clientes VALUES (6, 'Nora', 'Cali', 25)", out: "1 fila insertada." }]
  },
  update: {
    name: "UPDATE", tagline: "Modifica filas",
    what: "UPDATE cambia valores de filas que ya existen.",
    how: "El motor recorre las filas, aplica el SET a las que cumplen el WHERE y deja intactas las demás. Sin WHERE, ¡las cambia todas!",
    real: "Subir el precio de un producto o corregir el dato de un cliente.",
    syntax: "UPDATE tabla SET col = valor WHERE condicion;",
    examples: [{ cmd: "UPDATE productos SET precio = 60 WHERE id = 4", out: "1 fila actualizada." }]
  },
  delete: {
    name: "DELETE", tagline: "Borra filas",
    what: "DELETE FROM elimina filas de una tabla.",
    how: "El motor descarta las filas que cumplen el WHERE y conserva las demás. Sin WHERE, borra todo el contenido.",
    real: "Dar de baja un producto descatalogado.",
    syntax: "DELETE FROM tabla WHERE condicion;",
    examples: [{ cmd: "DELETE FROM pedidos WHERE id = 6", out: "1 fila eliminada." }]
  },
  agregados: {
    name: "COUNT / SUM / AVG", tagline: "Resume muchas filas en un valor",
    what: "Las funciones de agregado resumen un conjunto de filas en un único valor: cuántas hay (COUNT), cuánto suman (SUM), su media (AVG), el mínimo (MIN) o el máximo (MAX).",
    how: "El motor recorre las filas, acumula el cálculo y devuelve una sola fila con el resultado.",
    real: "Cuántos pedidos hay, cuánto dinero suman en total o el precio medio.",
    syntax: "SELECT COUNT(*) FROM tabla;",
    examples: [
      { cmd: "SELECT COUNT(*) FROM clientes", out: "COUNT(*)\n--------\n5" },
      { cmd: "SELECT SUM(precio) FROM productos", out: "SUM(precio)\n-----------\n323.4" }
    ]
  },
  groupby: {
    name: "GROUP BY", tagline: "Agrupa y resume por categoría",
    what: "GROUP BY reúne en grupos las filas que comparten un valor y calcula agregados dentro de cada grupo.",
    how: "El motor clasifica las filas en grupos según la clave indicada y aplica el agregado dentro de cada grupo, devolviendo una fila por grupo.",
    real: "Número de pedidos por cliente o ventas por ciudad.",
    syntax: "SELECT grupo, COUNT(*) FROM tabla GROUP BY grupo;",
    examples: [{ cmd: "SELECT cliente_id, COUNT(*) FROM pedidos GROUP BY cliente_id", out: "cliente_id | COUNT(*)\n-----------+---------\n1          | 2\n2          | 2\n3          | 1\n4          | 1" }]
  },
  join: {
    name: "JOIN", tagline: "Combina varias tablas",
    what: "JOIN enlaza filas de dos tablas usando una condición ON, normalmente una clave que coincide en ambas.",
    how: "El motor combina cada fila de una tabla con las de la otra que cumplan el ON, formando filas más anchas que contienen columnas de las dos.",
    real: "Ver el nombre del cliente junto a cada pedido, en lugar de un id.",
    syntax: "SELECT ... FROM a JOIN b ON a.clave = b.clave;",
    examples: [{ cmd: "SELECT clientes.nombre, pedidos.fecha FROM pedidos JOIN clientes ON pedidos.cliente_id = clientes.id", out: "nombre | fecha\n-------+-----------\nAna    | 2024-01-10\nAna    | 2024-01-15\nLuis   | 2024-02-01" }]
  },
  createtable: {
    name: "CREATE TABLE", tagline: "Crea una tabla",
    what: "CREATE TABLE define una tabla nueva con sus columnas y tipos.",
    how: "El motor reserva una estructura con las columnas indicadas y sin filas. Después podrás INSERTAR registros en ella.",
    real: "Diseñar el esquema de una aplicación antes de empezar a guardar datos.",
    syntax: "CREATE TABLE nombre (col tipo, ...);",
    examples: [{ cmd: "CREATE TABLE etiquetas (id INTEGER, texto TEXT)", out: "Tabla 'etiquetas' creada con 2 columnas." }]
  },
  tipos: {
    name: "tipos de datos", tagline: "INTEGER, TEXT, REAL",
    what: "Cada columna tiene un tipo: INTEGER (números enteros), TEXT (texto) y REAL (números decimales).",
    how: "El gestor usa el tipo como documentación del dato y para calcular: con REAL las sumas arrastran decimales, con INTEGER no.",
    real: "Precios en REAL, nombres en TEXT y cantidades en INTEGER.",
    syntax: "col INTEGER | col TEXT | col REAL",
    examples: [{ cmd: "CREATE TABLE p (id INTEGER, nombre TEXT, precio REAL)", out: "Tabla 'p' creada con 3 columnas." }]
  },
  claves: {
    name: "claves", tagline: "PRIMARY KEY y FOREIGN KEY",
    what: "La PRIMARY KEY identifica cada fila de forma única. La FOREIGN KEY es una columna que apunta a la clave de otra tabla.",
    how: "El motor usa la PK como identificador (normalmente 'id') y la FK para relacionar tablas en un JOIN.",
    real: "pedidos.cliente_id apunta a clientes.id: así se enlazan los pedidos con su cliente.",
    syntax: "id INTEGER PRIMARY KEY   |   cliente_id INTEGER REFERENCES clientes(id)",
    examples: [{ cmd: ".schema", out: "clientes(id, nombre, ciudad, edad)\nproductos(id, nombre, precio, stock, descuento)\npedidos(id, cliente_id, producto_id, cantidad, fecha)" }]
  },
  like: {
    name: "LIKE", tagline: "Busca patrones de texto",
    what: "LIKE compara texto con un patrón: el símbolo % significa 'cualquier cosa' y _ un único carácter.",
    how: "El motor traduce el patrón a una búsqueda y compara cada valor. LIKE '%a%' encuentra cualquier texto que contenga una 'a'.",
    real: "Buscar clientes cuyo nombre empiece por 'A': LIKE 'A%'.",
    syntax: "WHERE columna LIKE 'patron%';",
    examples: [{ cmd: "SELECT nombre FROM clientes WHERE nombre LIKE 'A%'", out: "nombre\n------\nAna" }]
  },
  null: {
    name: "NULL", tagline: "Valores ausentes",
    what: "NULL no es 0 ni una cadena vacía: significa 'sin valor'. Se comprueba con IS NULL / IS NOT NULL.",
    how: "El motor trata NULL como desconocido: cualquier comparación con NULL da desconocido, por eso nunca se escribe '= NULL'.",
    real: "Un producto sin descuento o un pedido sin fecha registrada.",
    syntax: "WHERE columna IS NULL;   |   WHERE columna IS NOT NULL;",
    examples: [{ cmd: "SELECT nombre FROM productos WHERE descuento IS NULL", out: "nombre\n-------\nRaton\nMonitor" }]
  }
};

    columns.push(col);
  } while (eatPunct(p, ","));
  expectPunct(p, ")");
  db.tables[name] = { columns, rows: [] };
  return okMsg("Tabla '" + name + "' creada con " + columns.length + " columnas.\n", "CREATE");
}
function isReservedType(p) { const t = peek(p); return t && t.t === "id" && RESERVED.has(t.v.toLowerCase()); }
function execDrop(db, p) {
  expectKw(p, "drop"); expectKw(p, "table");
  eatKw(p, "if");
  if (isKw(p, "exists")) p.i++;
  const name = expectIdent(p);
  if (db.tables[name]) delete db.tables[name];
  return okMsg("Tabla '" + name + "' eliminada.\n", "DROP");
}

/* --- salida --- */
function okMsg(text, tipo) { return { tipo, columns: [], rows: [], out: text, error: false }; }
function errMsg(text) { return { tipo: "", columns: [], rows: [], out: "ERROR: " + text + "\n", error: true }; }
function cellStr(v) {
  if (v === null || v === undefined) return "NULL";
  if (typeof v === "number" && !Number.isInteger(v)) return String(Math.round(v * 100) / 100);
  return String(v);
}
function formatTable(columns, rows) {
  if (!columns.length) return "";
  const widths = columns.map(c => String(c).length);
  const body = rows.map(r => r.map((v, i) => { const s = cellStr(v); if (s.length > widths[i]) widths[i] = s.length; return s; }));
  const line = arr => arr.map((c, i) => String(c).padEnd(widths[i])).join(" | ");
  const sep = widths.map(w => "-".repeat(w)).join("-+-");
  let out = line(columns) + "\n" + sep + "\n";
  out += body.map(line).join("\n");
  if (rows.length) out += "\n";
  out += "(" + rows.length + " fila" + (rows.length === 1 ? "" : "s") + ")\n";
  return out;
}
function schemaLine(db, name) {
  const t = db.tables[name];
  if (!t) return "-- No existe la tabla '" + name + "'\n";
  return name + "(" + t.columns.join(", ") + ")\n";
}

function runSQL(db, sqlRaw) {
  const sql = String(sqlRaw).trim();
  if (!sql) return { tipo: "", columns: [], rows: [], out: "", error: false };
  if (sql[0] === ".") {
    const cmd = sql.slice(1).trim().split(/\s+/)[0].toLowerCase();
    if (cmd === "tables") return okMsg(Object.keys(db.tables).sort().join("   ") + "\n", "TABLES");
    if (cmd === "schema") { let o = ""; for (const n of Object.keys(db.tables)) o += schemaLine(db, n); return okMsg(o, "SCHEMA"); }
    if (cmd === "help") return okMsg("Comandos: .tables, .schema, .help\nSQL: SELECT, INSERT, UPDATE, DELETE, CREATE TABLE, DROP TABLE\n", "HELP");
    return errMsg("Comando desconocido: ." + cmd);
  }
  const clean = sql.replace(/;\s*$/, "");
  try {
    const toks = tokenize(clean);
    const p = mkp(toks);
    const first = toks[0] ? toks[0].v.toLowerCase() : "";
    let res;
    if (first === "select") { const ast = parseSelect(p); const r = execSelect(db, ast); res = { tipo: "SELECT", columns: r.columns, rows: r.rows, out: formatTable(r.columns, r.rows), error: false }; }
    else if (first === "insert") res = execInsert(db, p);
    else if (first === "update") res = execUpdate(db, p);
    else if (first === "delete") res = execDelete(db, p);
    else if (first === "create") res = execCreate(db, p);
    else if (first === "drop") res = execDrop(db, p);
    else if (first === "describe" || first === "desc") { p.i++; res = okMsg(schemaLine(db, expectIdent(p)), "SCHEMA"); }
    else throw tokErr("Solo se admite SELECT, INSERT, UPDATE, DELETE, CREATE TABLE y DROP TABLE.");
    if (p.toks[p.i]) throw tokErr("Sintaxis no reconocida cerca de '" + p.toks[p.i].v + "'");
    return res;
  } catch (e) {
    return errMsg(e && e.sql ? e.message : ("Error de sintaxis: " + (e && e.message ? e.message : e)));
  }
}

/* ---------- 5. ESTADO + PERSISTENCIA ---------- */
const STORE_KEY = "cli_sql_state_v1";
function defaultProgress() { return { xp: 0, completed: [], streak: 0, lastDate: null }; }
function loadProgress() {
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? Object.assign(defaultProgress(), JSON.parse(raw)) : defaultProgress(); }
  catch (e) { return defaultProgress(); }
}
function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state.progress)); } catch (e) {} }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function touchStreak() {
  const p = state.progress, t = todayStr();
  if (p.lastDate === t) return;
  const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  p.streak = p.lastDate === y ? p.streak + 1 : 1;
  p.lastDate = t;
  saveProgress();
}

let state = {
  screen: "home",
  progress: loadProgress(),
  lesson: null, cardIndex: 0,
  steps: [], stepIndex: 0, hearts: 3, earned: 0,
  term: null, wrongTries: 0,
  feedback: null
};

/* ---------- 6. VISTAS ---------- */
const app = document.getElementById("app");
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function header() {
  const p = state.progress;
  return `
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <button onclick="goHome()" class="flex items-center gap-2 font-black text-xl text-duo-blue">
        <span class="text-2xl">🗃️</span> CLI&nbsp;SQL
      </button>
      <div class="flex items-center gap-3 text-sm font-bold">
        <span class="flex items-center gap-1 text-duo-yellow">🔥 ${p.streak}</span>
        <span class="flex items-center gap-1 text-duo-blue">⭐ ${p.xp} XP</span>
      </div>
    </div>
  </header>`;
}

function renderHome() {
  const p = state.progress;
  const nodes = LESSONS.map((l, i) => {
    const unlocked = i === 0 || p.completed.includes(LESSONS[i - 1].id);
    const done = p.completed.includes(l.id);
    const offset = i % 2 === 0 ? "translate-x-8" : "-translate-x-8";
    return `
    <div class="flex flex-col items-center ${offset}">
      <button ${unlocked ? `onclick="startLesson(${l.id})"` : "disabled"}
        class="relative w-20 h-20 rounded-full flex items-center justify-center text-3xl font-black btn-3d
          ${done ? "bg-duo-green text-white shadow-[0_5px_0_#46a302]" :
                    unlocked ? "bg-duo-blue text-white shadow-[0_5px_0_#1899d6] pulse-ring" :
                               "bg-slate-200 text-slate-400 shadow-[0_5px_0_#cbd5e1] cursor-not-allowed"}">
        ${done ? "✓" : unlocked ? l.icon : "🔒"}
      </button>
      <span class="mt-2 text-xs font-bold ${unlocked ? "text-slate-700" : "text-slate-400"}">${l.title}</span>
    </div>
    ${i < LESSONS.length - 1 ? `<div class="w-2 h-8 ${p.completed.includes(l.id) ? "bg-duo-blue" : "bg-slate-200"} rounded-full"></div>` : ""}`;
  }).join("");

  app.innerHTML = `${header()}
  <main class="max-w-3xl mx-auto px-4 py-8 fade-in">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-slate-800">Aprende SQL desde cero</h1>
      <p class="text-slate-500 font-semibold mt-1">Teoría clara + consultas reales sobre una base de datos de ejemplo.</p>
    </div>
    <div class="bg-white rounded-3xl border-2 border-slate-200 p-8 flex flex-col items-center gap-2">
      ${nodes}
    </div>
    <div class="mt-6 flex flex-col items-center gap-3">
      <button onclick="startSandbox()" class="bg-slate-800 text-white font-black px-6 py-3 rounded-2xl shadow-[0_5px_0_#1e293b] btn-3d">🗄️ SQL libre (sandbox)</button>
      <button onclick="resetAll()" class="text-xs font-bold text-slate-400 hover:text-duo-red underline">Reiniciar todo el progreso</button>
    </div>
  </main>`;
}

function renderTheory() {
  const lesson = state.lesson;
  const t = THEORY[lesson.theory[state.cardIndex]];
  const total = lesson.theory.length;
  const isLast = state.cardIndex === total - 1;

  const examples = t.examples.map(e => `
    <div class="term bg-slate-900 text-slate-100 rounded-xl overflow-hidden text-sm">
      <div class="flex"><span class="text-duo-blue px-3 py-1">db&gt;</span><span class="py-1">${esc(e.cmd)}</span></div>
      ${e.out ? `<div class="text-slate-300 px-3 pb-2 whitespace-pre overflow-x-auto">${esc(e.out)}</div>` : ""}
    </div>`).join("");

  const section = (icon, title, b) => `
    <div class="border-l-4 border-duo-blue pl-4">
      <h3 class="font-black text-slate-800 flex items-center gap-2">${icon} ${title}</h3>
      <p class="text-slate-600 font-medium mt-1">${b}</p>
    </div>`;

  app.innerHTML = `${header()}
  <main class="max-w-3xl mx-auto px-4 py-6 fade-in">
    <div class="mb-4">
      <div class="flex items-center justify-between text-sm font-bold text-slate-400">
        <span>Fase de teoría</span><span>${state.cardIndex + 1} / ${total}</span>
      </div>
      <div class="h-3 bg-slate-200 rounded-full mt-2 overflow-hidden">
        <div class="h-full bg-duo-blue transition-all" style="width:${((state.cardIndex + 1) / total) * 100}%"></div>
      </div>
    </div>

    <div class="bg-white rounded-3xl border-2 border-slate-200 p-6 md:p-8">
      <div class="flex items-center gap-3 mb-6">
        <span class="term bg-slate-900 text-duo-blue font-bold px-3 py-1 rounded-lg">${esc(t.name)}</span>
        <span class="text-slate-500 font-bold">${esc(t.tagline)}</span>
      </div>
      <div class="space-y-5">
        ${section("🔎", "¿Qué es y qué hace?", esc(t.what))}
        ${section("⚙️", "¿Cómo funciona internamente?", esc(t.how))}
        ${section("💼", "¿Para qué sirve en la vida real?", esc(t.real))}
        <div class="border-l-4 border-duo-green pl-4">
          <h3 class="font-black text-slate-800">⌨️ ¿Cómo se usa?</h3>
          <p class="text-slate-600 font-medium mt-1">Sintaxis: <code class="term bg-slate-100 px-2 py-0.5 rounded">${esc(t.syntax)}</code></p>
          <div class="mt-3 space-y-2">${examples}</div>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between mt-6">
      <button onclick="prevCard()" class="font-black text-slate-400 px-4 py-3 rounded-2xl hover:bg-slate-200" ${state.cardIndex === 0 ? "disabled" : ""}>Atrás</button>
      <button onclick="nextCard()" class="bg-duo-blue text-white font-black px-8 py-3 rounded-2xl shadow-[0_5px_0_#1899d6] btn-3d hover:brightness-105">
        ${isLast ? "¡Ir a la práctica!" : "Siguiente"}
      </button>
    </div>
  </main>`;
}

function heartRow() { let h = ""; for (let i = 0; i < 3; i++) h += i < state.hearts ? "❤️" : "🤍"; return h; }

function termLinesHtml(term) {
  return term.lines.map(l =>
    l.type === "cmd"
      ? `<div class="text-slate-100"><span class="text-duo-blue">db&gt;</span> ${esc(l.text)}</div>`
      : `<div class="${l.error ? "text-duo-red" : "text-slate-300"} whitespace-pre-wrap">${esc(l.text)}</div>`
  ).join("");
}

function renderPractice() {
  const step = state.steps[state.stepIndex];
  const pct = (state.stepIndex / state.steps.length) * 100;
  let body = "";
  if (step.type === "mc") {
    body = `
      <h2 class="text-2xl font-black text-slate-800 mb-6">${esc(step.q)}</h2>
      <div class="grid gap-3">
        ${step.options.map((o, i) => {
          let cls = "border-slate-200 hover:bg-slate-50";
          if (state.feedback) {
            if (i === step.answer) cls = "border-duo-green bg-green-50";
            else if (i === state.feedback.picked) cls = "border-duo-red bg-red-50";
          }
          return `<button ${state.feedback ? "disabled" : ""} onclick="answerMC(${i})"
            class="text-left font-bold border-2 rounded-2xl px-5 py-4 ${cls} transition">${esc(o)}</button>`;
        }).join("")}
      </div>`;
  } else {
    body = `
      <h2 class="text-2xl font-black text-slate-800 mb-2">🗄️ ${esc(step.prompt)}</h2>
      <p class="text-slate-500 font-semibold mb-4">Escribe la consulta SQL y pulsa Enter.</p>
      <div class="term bg-slate-900 rounded-2xl p-4 h-64 overflow-y-auto text-sm" id="termBody">
        ${termLinesHtml(state.term)}
        <div class="text-slate-100 flex items-center gap-1">
          <span class="text-duo-blue">db&gt;</span>
          <input id="termInput" autocomplete="off" spellcheck="false"
            class="flex-1 bg-transparent outline-none text-slate-100 caret-duo-blue" />
        </div>
      </div>
      ${state.wrongTries >= 2 ? `<p class="mt-3 text-sm font-bold text-duo-yellow">💡 Pista: ${esc(step.hint)}</p>` : ""}
      <div id="termMsg" class="mt-2 text-sm font-bold h-5"></div>`;
  }

  app.innerHTML = `${header()}
  <main class="max-w-3xl mx-auto px-4 py-6 fade-in">
    <div class="flex items-center gap-4 mb-6">
      <div class="flex-1 h-3 bg-slate-200 rounded-full overflow-hidden">
        <div class="h-full bg-duo-blue transition-all" style="width:${pct}%"></div>
      </div>
      <span class="font-black text-lg whitespace-nowrap">${heartRow()}</span>
    </div>
    <div class="bg-white rounded-3xl border-2 border-slate-200 p-6 md:p-8">${body}</div>
  </main>`;

  if (step.type === "sql" && !state.feedback) attachTermInput(state.term, v => submitSQL(v));
}

function attachTermInput(term, onRun) {
  const input = document.getElementById("termInput");
  if (!input) return;
  const body = document.getElementById("termBody");
  if (body) body.scrollTop = body.scrollHeight;
  input.focus();
  term.histPos = (term.history || []).length;
  input.addEventListener("keydown", e => {
    const h = term.history || [];
    if (e.key === "Enter") { onRun(input.value); }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (term.histPos > 0) { term.histPos--; input.value = h[term.histPos] || ""; } }
    else if (e.key === "ArrowDown") { e.preventDefault(); if (term.histPos < h.length - 1) { term.histPos++; input.value = h[term.histPos] || ""; } else { term.histPos = h.length; input.value = ""; } }
  });
}

function renderResult(success) {
  const lesson = state.lesson;
  app.innerHTML = `${header()}
  <main class="max-w-3xl mx-auto px-4 py-12 text-center fade-in">
    <div class="text-6xl mb-4">${success ? "🎉" : "💔"}</div>
    <h1 class="text-3xl font-black ${success ? "text-duo-green" : "text-duo-red"}">
      ${success ? "¡Lección completada!" : "Te quedaste sin vidas"}
    </h1>
    <p class="text-slate-500 font-semibold mt-2">
      ${success ? "Conectaste la teoría con consultas reales." : "Repasa la teoría y vuelve a intentarlo."}
    </p>
    ${success ? `<div class="flex justify-center gap-6 mt-6">
      <div class="bg-white border-2 border-slate-200 rounded-2xl px-6 py-4"><div class="text-2xl font-black text-duo-blue">+${state.earned}</div><div class="text-xs font-bold text-slate-400">XP</div></div>
      <div class="bg-white border-2 border-slate-200 rounded-2xl px-6 py-4"><div class="text-2xl font-black text-duo-yellow">${state.progress.streak}</div><div class="text-xs font-bold text-slate-400">RACHA 🔥</div></div>
    </div>` : ""}
    <div class="mt-10 flex justify-center gap-3">
      <button onclick="goHome()" class="font-black text-slate-500 px-6 py-3 rounded-2xl hover:bg-slate-200">Inicio</button>
      <button onclick="startLesson(${lesson.id})" class="bg-duo-blue text-white font-black px-8 py-3 rounded-2xl shadow-[0_5px_0_#1899d6] btn-3d">
        ${success ? "Repetir" : "Intentar de nuevo"}
      </button>
    </div>
  </main>`;
}

function startSandbox() { state.screen = "sandbox"; state.term = newTerm(); renderSandbox(); }
function resetSandbox() { state.term = newTerm(); renderSandbox(); }
function runSandbox(value) {
  const term = state.term;
  term.history = term.history || [];
  term.lines.push({ type: "cmd", text: value });
  if (String(value).trim()) term.history.push(String(value).trim());
  const r = runSQL(term.db, value);
  if (r.out) term.lines.push({ type: "out", text: r.out.replace(/\n$/, ""), error: r.error });
  renderSandbox();
}
function renderSandbox() {
  const term = state.term;
  app.innerHTML = `${header()}
  <main class="max-w-3xl mx-auto px-4 py-6 fade-in">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-black text-slate-800">🗄️ SQL libre</h1>
      <div class="flex gap-2">
        <button onclick="resetSandbox()" class="text-sm font-bold text-slate-500 px-3 py-2 rounded-xl hover:bg-slate-200">Reiniciar</button>
        <button onclick="goHome()" class="text-sm font-bold text-slate-500 px-3 py-2 rounded-xl hover:bg-slate-200">Inicio</button>
      </div>
    </div>
    <p class="text-slate-500 font-semibold mb-3">Consulta la base de datos sin límites. Prueba: <code class="term bg-slate-200 px-1 rounded">.tables</code>, <code class="term bg-slate-200 px-1 rounded">SELECT * FROM clientes</code>. Usa ↑ y ↓ para el historial.</p>
    <div class="term bg-slate-900 rounded-2xl p-4 h-[28rem] overflow-y-auto text-sm" id="termBody">
      ${termLinesHtml(term)}
      <div class="text-slate-100 flex items-center gap-1">
        <span class="text-duo-blue">db&gt;</span>
        <input id="termInput" autocomplete="off" spellcheck="false"
          class="flex-1 bg-transparent outline-none text-slate-100 caret-duo-blue" />
      </div>
    </div>
  </main>`;
  attachTermInput(term, v => runSandbox(v));
}

/* ---------- 7. LÓGICA DE JUEGO ---------- */
function goHome() { state.screen = "home"; renderHome(); }

function startLesson(id) {
  state.lesson = LESSONS.find(l => l.id === id);
  state.cardIndex = 0;
  state.steps = state.lesson.steps;
  state.stepIndex = 0;
  state.hearts = 3;
  state.earned = 0;
  state.feedback = null;
  state.wrongTries = 0;
  state.term = newTerm();
  state.screen = "theory";
  renderTheory();
}
function prevCard() { if (state.cardIndex > 0) { state.cardIndex--; renderTheory(); } }
function nextCard() {
  if (state.cardIndex < state.lesson.theory.length - 1) { state.cardIndex++; renderTheory(); }
  else { state.screen = "practice"; state.term = newTerm(); state.stepIndex = 0; state.wrongTries = 0; renderPractice(); }
}

function answerMC(i) {
  if (state.feedback) return;
  const step = state.steps[state.stepIndex];
  state.feedback = { picked: i };
  if (i === step.answer) state.earned += 10;
  else state.hearts--;
  renderPractice();
  setTimeout(() => {
    if (state.hearts <= 0) { state.feedback = null; renderResult(false); return; }
    state.feedback = null;
    state.stepIndex++;
    state.wrongTries = 0;
    if (state.stepIndex >= state.steps.length) finishLesson();
    else renderPractice();
  }, i === step.answer ? 850 : 1650);
}

function submitSQL(value) {
  if (state.feedback) return;
  const step = state.steps[state.stepIndex];
  const term = state.term;
  term.history = term.history || [];
  term.lines.push({ type: "cmd", text: value });
  if (String(value).trim()) term.history.push(String(value).trim());
  const r = runSQL(term.db, value);
  if (r.out) term.lines.push({ type: "out", text: r.out.replace(/\n$/, ""), error: r.error });

  const ctx = { sql: value, tipo: r.tipo, resultado: { columnas: r.columns, filas: r.rows }, db: term.db, out: r.out };
  const passed = !r.error && typeof step.check === "function" && step.check(ctx);

  if (passed) {
    state.earned += 15;
    state.feedback = { term: true };
    renderPractice();
    setTimeout(() => {
      state.feedback = null;
      state.stepIndex++;
      state.wrongTries = 0;
      if (state.stepIndex >= state.steps.length) finishLesson();
      else renderPractice();
    }, 700);
  } else {
    state.wrongTries++;
    state.feedback = null;
    renderPractice();
    const msg = document.getElementById("termMsg");
    if (msg) {
      msg.textContent = r.error ? "⚠️ La consulta dio un error. Revisa la sintaxis." : "❌ Aún no. Prueba otra vez con la consulta correcta.";
      msg.className = "mt-2 text-sm font-bold h-5 text-duo-red";
    }
  }
}

function finishLesson() {
  const p = state.progress;
  if (!p.completed.includes(state.lesson.id)) p.completed.push(state.lesson.id);
  p.xp += state.earned;
  touchStreak();
  saveProgress();
  renderResult(true);
}
function resetAll() {
  if (confirm("¿Borrar XP, rachas y lecciones completadas?")) {
    state.progress = defaultProgress();
    saveProgress();
    renderHome();
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && state.screen === "theory") nextCard();
});

renderHome();
</script>
